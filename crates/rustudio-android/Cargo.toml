[package]
name = "rustudio-android"
description = "The Android app: a cdylib NativeActivity loads, around the rustudio library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# xbuild (`x build -p rustudio-android --platform android --arch arm64`)
# packages target/x/android/<arch>/cargo/<triple>/<profile>/librustudio_android.so
# into the APK, with manifest.yaml next to this file as its AndroidManifest.
# On other systems the crate is an empty library, so `cargo check
# --workspace` keeps passing everywhere.
[lib]
name = "rustudio_android"
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# The player path's transport (WebTransport + HTTPS sign in), and with it
# src/join_window.rs. The APK is built with `--features live` (the workflow);
# a build without it carries no QUIC stack.
live = ["rustudio/live"]

[target.'cfg(target_os = "android")'.dependencies]
# `live` is passed down from this crate's own feature, so the APK's build flag
# is what decides whether the join is compiled in.
rustudio = { path = "../..", default-features = false }
