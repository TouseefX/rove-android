[package]
name = "rustudio-live"
description = "A live Roblox session as rustudio's client DataModel: rove's snapshot/replication converted into Document mutations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
rustudio-core = { path = "../rustudio-core" }
rbx_dom_weak = "4"
rbx_types = "3"
serde_json = { version = "1", features = ["preserve_order"] }
rustc-hash = "2"
base64 = "0.22"

# rove decodes the wire; this crate never does. `rove-client-core` is a
# workspace member (its transport feature stays off: the live session owns
# that, and the transport brings a second rustls/sha2 major).
rove-client-core = { path = "../../rove/client-core" }
