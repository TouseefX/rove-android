name: Live world

# M1's acceptance run: rove's captured world snapshot (rove/tests/fixtures/
# world_snapshot.json — Workspace, Players/LocalPlayer, a Player with a
# Character, its Humanoid and an anchored Part) built into a clean rustudio
# Document by crates/rustudio-live and rendered by the player, with no network
# anywhere in the run.
#
# The numbers matter more than the picture: an artifact cannot be read back
# from here, so every measurement is printed into the log — the bridge's own
# report (nodes, instances, refs bound, refusals), frame statistics from
# `--bench`, and the size of each PNG written. tools/ci/m1_acceptance.py is
# the assertion step.

on:
  push:
    branches: ["**"]
    paths:
      - "crates/rustudio-live/**"
      - "crates/rustudio-core/**"
      - "crates/rustudio-engine/**"
      - "crates/rustudio-player/**"
      - "crates/rustudio-render/**"
      - "crates/rustudio-physics/**"
      - "src/**"
      - "Cargo.toml"
      - "build.rs"
      - "rove/tests/fixtures/**"
      - "tools/ci/**"
      - ".github/workflows/live.yml"
  pull_request:
    paths:
      - "crates/rustudio-live/**"
      - "rove/tests/fixtures/**"
      - "tools/ci/**"
      - ".github/workflows/live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-world-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Software Vulkan (lavapipe): the runner has no GPU.
  WGPU_BACKEND: vulkan

jobs:
  fixture-world:
    name: Fixture world (M1)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Mesa's software Vulkan driver is the GPU the runner does not have; the
      # rest is what eframe needs to build and link on Linux.
      - name: Install Mesa (software Vulkan) and the build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools libgl1-mesa-dri libvulkan1 \
            libasound2-dev libudev-dev pkg-config
          echo "--- vulkan devices:"
          vulkaninfo --summary 2>/dev/null | sed -n '1,40p' || true

      # The bridge's own tests first: a broken conversion fails here in a
      # minute, not after a long build.
      - name: Bridge tests (a rove snapshot in, a DataModel out)
        run: |
          set +e
          cargo test -p rustudio-live --message-format=short -- --nocapture 2>&1 | tee /tmp/live-tests.log
          status=${PIPESTATUS[0]}
          set -e
          echo "--- summary:"
          grep -E "^(test result|running|test )" /tmp/live-tests.log | head -40
          if [ "$status" -ne 0 ]; then
            echo "--- diagnostics as annotations:"
            for page in 0 1 2; do
              python3 tools/ci/annotate.py /tmp/live-tests.log "$page" || true
            done
            exit "$status"
          fi

      - name: Build the player
        run: |
          set +e
          cargo build --release -p rustudio --message-format=short 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "--- diagnostics as annotations:"
            for page in 0 1 2; do
              python3 tools/ci/annotate.py /tmp/build.log "$page" || true
            done
            exit "$status"
          fi
          tail -5 /tmp/build.log

      # --headless: no window and no compositor (frames are drawn to an
      # offscreen target and read back — the offscreen path in the player), so
      # this needs no gamescope and no Xvfb. --live-snapshot opens the snapshot
      # as the document (src/app.rs open_world_snapshot); --no-ui leaves the
      # scene alone; --fixed-dt makes the frame clock the process's own; --log
      # writes the Output lines the report is read from.
      - name: Render the fixture world (headless)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p out
          SNAPSHOT=rove/tests/fixtures/world_snapshot.json
          ls -l "$SNAPSHOT"
          ./target/release/rustudio \
              --live-snapshot "$SNAPSHOT" \
              --no-ui \
              --headless \
              --screenshot out/fixture-world.png \
              --shot-after 3 \
              --seconds 5 \
              --fixed-dt 0.0166667 \
              --result out/live-world.json \
              --log out/live-world.log \
            > out/run.log 2>&1 || { echo "--- the run failed; log:"; tail -150 out/run.log; exit 1; }
          echo "--- run log (tail):"
          tail -40 out/run.log || true

      # The same scene timed. --bench prints its report to stdout and writes it
      # beside the shots; this runner draws with lavapipe, a CPU rasteriser, so
      # the number is a floor, not the phone's.
      - name: Frame statistics (--bench)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ./target/release/rustudio \
              --live-snapshot rove/tests/fixtures/world_snapshot.json \
              --no-ui --headless \
              --bench out/bench.json \
              --seconds 5 \
              --fixed-dt 0.0166667 \
            > out/bench.stdout.log 2>&1 || { echo "--- bench failed; log:"; tail -80 out/bench.stdout.log; exit 1; }
          echo "=== bench report (stdout) ==="
          cat out/bench.stdout.log
          echo
          echo "=== frame statistics, one line ==="
          python3 tools/ci/bench_line.py out/bench.json

      # Everything a person or a later run needs, as text, then the verdict.
      - name: Numbers and acceptance
        run: |
          set -euo pipefail
          python3 tools/ci/m1_acceptance.py out

      - name: Upload the picture and the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-world-${{ github.sha }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
