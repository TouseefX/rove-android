name: Lockfile

# Cargo.lock is generated, not hand-written. Adding a dependency or a workspace
# member makes it stale, and every `--locked` job then refuses to build — so the
# one place that resolves the graph is this job: it runs cargo where there is a
# network, and commits the result back to the branch it ran on.
#
# `cargo fetch` is the minimal refresh: it resolves what is missing and leaves
# every existing pin alone, so the diff is the new entries, not a re-resolved
# world. (Precedent: anyrun-org/anyrun#334 regenerates with plain `cargo fetch`
# and the diff is exactly the affected entries.)
#
# One GitHub caveat: a commit pushed with GITHUB_TOKEN does not start workflows,
# so the fix commit itself builds nothing. Re-run CI after it lands (or push the
# next change) and `--locked` passes from then on.

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The token checkout leaves is the token that pushes.
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve what is missing (leaves existing pins alone)
        run: |
          set -o pipefail
          cargo fetch --manifest-path Cargo.toml 2>&1 | tee /tmp/fetch.log || {
            echo "::error::cargo could not resolve the workspace; the manifest is wrong, not the lock"
            tail -40 /tmp/fetch.log
            exit 1
          }

      - name: Say what changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "::notice::Cargo.lock is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::Cargo.lock gained $(git diff --numstat -- Cargo.lock | cut -f1-2) line(s)"
          git diff --stat -- Cargo.lock
          git --no-pager diff -- Cargo.lock | head -120

      - name: Commit it back
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "arena-lockfile"
          git config user.email "arena-lockfile@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Cargo.lock: refresh generated by CI (cargo fetch)"
          git push origin "HEAD:${{ github.ref_name }}"
