name: CI

on:
  push:
    # (branches as well as tags: a filter on one alone stops runs for the other)
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  # A lock refresh can also be asked for by hand (branches only; a refresh on a
  # tag would commit to nothing).
  workflow_dispatch:

permissions:
  contents: read

env:
  # annotate.py strips these before parsing; they are what makes a piped log a
  # log rather than one long line.
  CARGO_TERM_COLOR: always

jobs:
  # Checks and tests run for branches and pull requests. A v* tag points at a
  # commit main already tested, so its run only builds and publishes.
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # A build that starts before the lock is resolved fails on `--locked` with
    # nothing to say; the lock is the first thing that has to succeed.
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The lock job may have committed a refresh to this branch, and
      # `github.sha` is the commit that started the run — one behind it. Check
      # out the ref, so --locked is applied to the tree the lock describes.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Check
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --locked \
            --message-format=short 2>&1 | tee "$RUNNER_TEMP/check.log"
      # The Android APK is built with `--features live`, which is what compiles
      # src/join_window.rs and the Start Page's Play button — code the step
      # above never sees, because it uses default features. The APK job would
      # find a mistake in it 40 minutes and one artifact later.
      - name: The app with the join in it (the APK's feature set)
        shell: bash
        run: |
          set -o pipefail
          cargo check -p rustudio --features live --locked \
            --message-format=short 2>&1 | tee -a "$RUNNER_TEMP/check.log"
      # These lifecycle tests need no display. Run them on Linux, including the
      # live-feature code that is otherwise only checked (not tested) here.
      - name: Live handover and loading tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p rustudio-engine -p rustudio-player --locked --message-format=short 2>&1 | tee "$RUNNER_TEMP/test.log"
          cargo test -p rustudio --features live --lib --locked live_handover_tests --message-format=short 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      # `tests/ui_glyphs.rs` is the only thing that catches a UI string no
      # bundled font can draw, and it runs where the suite runs — macOS, after a
      # queue that is often longer than the job. The rule is a property of the
      # source, so it is applied here too, on the two runners that finish in
      # three minutes: a glyph mistake stops a run at three minutes rather than
      # after the slow job has spent its hour finding it.
      #
      # Both halves run. The Python preflight is the same scan without a
      # toolchain (it is what makes this step cheap); the Rust test is the
      # authority. Running both is what keeps the cheap one honest — were they
      # ever to disagree, this step is where it shows, and it is the one test
      # binary that does not need a display.
      - name: UI text uses glyphs the bundled fonts have
        shell: bash
        run: |
          set -o pipefail
          python3 tools/ci/ui_glyphs_preflight.py 2>&1 | tee -a "$RUNNER_TEMP/check.log"
          cargo test --locked -p rustudio --test ui_glyphs --message-format=short \
            2>&1 | tee -a "$RUNNER_TEMP/check.log"
      # Tests run on macOS and the two release jobs (docs/M0-UNDERSTANDING.md
      # 10.9: "tests on macOS only"). Not Linux — no display. Not Windows
      # either: the suite needs a display as well, and on that runner it has
      # never finished (26 minutes in the accepted run, then a 35-minute bound
      # with rustc dying on an "N warnings" summary). A job that cannot pass is
      # not a gate; Windows is covered by `check` and `windows-release`, which
      # do compile and link the tests.
      - name: Test
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 40
        run: |
          set -o pipefail
          # Bounded, so a test that never returns shows up as a timeout with a
          # log rather than as a job that ran out of its allowance.
          timeout 2100 cargo test --workspace --locked \
            --message-format=short 2>&1 | tee "$RUNNER_TEMP/test.log"
      # Job logs are not readable back from here, but annotations are; see
      # tools/ci/annotate.py. A separate always-run step, because a step that
      # fails loses most of its own annotations.
      - name: Re-emit the diagnostics
        if: always()
        shell: bash
        run: |
          # Ten annotations survive a step, whatever it emits — pages 2.. are
          # dropped — and cargo ends a failed build with one "N warnings" summary
          # per crate, so neither "page through everything" nor "tail the log"
          # finds the line that stopped it. Drop the summaries and the progress
          # lines, keep the last ten that remain.
          for log in "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/test.log"; do
            if [ ! -f "$log" ]; then
              echo "::notice::$log: not written"
              continue
            fi
            echo "::notice::$log: $(wc -l < "$log") line(s)"
            # Colour comes from CARGO_TERM_COLOR, and a log full of SGR escapes
            # reads as noise in an annotation.
            # (grep exits 1 when nothing survives the filter, and this shell
            # runs with -e: a reporter must never fail the job it reports on.)
            plain=$(mktemp)
            sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$log" \
              | grep -vE '^$|generated [0-9]+ warning|warning:|^ *$|^ *\||^ *= |^ +--> |^ +(Compiling|Checking|Downloaded|Downloading|Updating|Finished|Running) ' > "$plain" || true
            # A failed assert!'s own message is the diagnostic: print what comes
            # after the "panicked at" line first, since that is where the test
            # prints the list of what it found.
            if grep -q "panicked at" "$plain"; then
              echo "--- the failure"
              sed -n '/panicked at/,$p' "$plain" | head -6 | sed 's/^/::error::log: /'
            fi
            echo "--- first lines"
            head -4 "$plain" | sed 's/^/::error::log: /' || true
            echo "--- last lines"
            tail -4 "$plain" | sed 's/^/::error::log: /' || true
            rm -f "$plain"
            true
          done

  # macOS: Apple Silicon and Intel. The tests run here too (the GPU tests
  # skip themselves when the runner has no Metal device).
  # The join crate's evidence, which needs no display and no GPU: the
  # allocation parser against recorded bodies, the login packets against rove's
  # Python vectors and rove's own encoder, a session fed a recording through the
  # same `Session` a live join uses, and the live feature (WebTransport + sign
  # in) compiling on both runners. Ubuntu is enough for the tests; the second
  # runner is there because a `#[cfg(target_os)]` in the login packet would
  # otherwise only ever be compiled on macOS.
  join:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Offline evidence (allocation, packets, session replay)
        shell: bash
        run: |
          set +e
          cargo test -p rustudio-join --locked --message-format=short 2>&1 \
            | tee "$RUNNER_TEMP/join.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "--- tests:"
          grep -E "^(running|test result|test .* (ok|FAILED))" "$RUNNER_TEMP/join.log" || true
          if [ "$status" -ne 0 ]; then
            echo "--- what failed:"
            sed -n '/panicked at/,$p' "$RUNNER_TEMP/join.log" | head -30
          fi
          # The job log cannot be fetched back, so the log goes where the
          # annotation step can always reach it.
          mkdir -p out
          cp "$RUNNER_TEMP/join.log" out/join.log 2>/dev/null || true
          echo "$status" > out/join.status
          exit "$status"
      - name: The ported codec against rove's own encoder (both in one build)
        shell: bash
        # If this step goes red, the line to read is the `error` one above the
        # "Process completed" line: this example is the only place two login
        # modules are compiled together, so a mistake here is a mistake in the
        # comparison, not in the crate.
        if: always()
        run: |
          set +e
          cargo run -p rustudio-join --example crosscheck --locked \
            --message-format=short 2>&1 | tee "$RUNNER_TEMP/join-crosscheck.log"
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p out
          cp "$RUNNER_TEMP/join-crosscheck.log" out/join-crosscheck.log 2>/dev/null || true
          echo "$status" > out/join-crosscheck.status
          tail -3 "$RUNNER_TEMP/join-crosscheck.log" || true
          exit "$status"
      - name: The live feature compiles and its offline branches hold (WebTransport, sign in, join-game)
        shell: bash
        run: |
          set +e
          # `cargo test`, not `cargo check`: the join worker's branches that
          # fail before a request goes out (no account, a cookie that is not a
          # cookie, polling the report from another thread) need no network and
          # are the half of a real join that can be tested. Everything after
          # them needs an account and a phone; see docs/JOIN-M2.md.
          cargo test -p rustudio-join --features live --locked \
            --message-format=short 2>&1 | tee "$RUNNER_TEMP/join-live.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "--- live tests:"
          grep -E "^(running|test result|test .* (ok|FAILED))" "$RUNNER_TEMP/join-live.log" || true
          mkdir -p out
          cp "$RUNNER_TEMP/join-live.log" out/join-live.log 2>/dev/null || true
          echo "$status" > out/join-live.status
          exit "$status"

      - name: Choose the log the annotations come from
        if: always()
        shell: bash
        run: |
          # The first failing step's log, by its recorded exit status: a compile
          # error in the tests and one in the live build are both `error:` lines,
          # but only one of them is the reason the job stopped. Without the
          # status the choice fell to whichever log merely contained `error`,
          # which is how a green tests step's dependency *warnings* got reported
          # as the failure.
          for name in join join-crosscheck join-live; do
            [ -f "out/$name.log" ] || continue
            status=$(cat "out/$name.status" 2>/dev/null || echo 0)
            echo "$name exited $status"
            if [ "$status" != "0" ]; then
              cp "out/$name.log" out/diagnostics.log
              echo "annotating out/$name.log (exit $status)"
              exit 0
            fi
          done
          # Nothing recorded a failure: annotate the quietest last resort so the
          # job still says something, rather than nothing.
          for name in join join-crosscheck join-live; do
            [ -f "out/$name.log" ] && cp "out/$name.log" out/diagnostics.log && \
              echo "annotating out/$name.log (no step recorded a failure)" && exit 0
          done
          ls -l out/ || true

      - name: Re-emit the build's diagnostics
        if: always()
        shell: bash
        run: |
          if [ ! -f out/diagnostics.log ]; then
            echo "::notice::no failing log was captured"
            exit 0
          fi
          echo "=== the failure, verbatim"
          grep -nE "(panicked at|FAILED|DISAGREE|error\[|^error:)" out/diagnostics.log | head -20 || true
          sed -n '/panicked at/,+8p' out/diagnostics.log | head -40 || true
          # One call: a step keeps only its first ten error annotations, so
          # paging from several calls drops everything past the first page. The
          # script puts the failure itself in annotation 1, whole.
          python3 tools/ci/annotate.py out/diagnostics.log 0 || true

  macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # The lock job may have committed a refresh to this branch, and
      # `github.sha` is the commit that started the run — one behind it. Check
      # out the ref, so --locked is applied to the tree the lock describes.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --locked \
            --message-format=short 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked \
            --message-format=short 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Re-emit the diagnostics
        if: always()
        shell: bash
        run: |
          # Ten annotations survive a step, whatever it emits — pages 2.. are
          # dropped — and cargo ends a failed build with one "N warnings" summary
          # per crate, so neither "page through everything" nor "tail the log"
          # finds the line that stopped it. Drop the summaries and the progress
          # lines, keep the last ten that remain.
          for log in "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/test.log"; do
            if [ ! -f "$log" ]; then
              echo "::notice::$log: not written"
              continue
            fi
            echo "::notice::$log: $(wc -l < "$log") line(s)"
            # Colour comes from CARGO_TERM_COLOR, and a log full of SGR escapes
            # reads as noise in an annotation.
            # (grep exits 1 when nothing survives the filter, and this shell
            # runs with -e: a reporter must never fail the job it reports on.)
            plain=$(mktemp)
            sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$log" \
              | grep -vE '^$|generated [0-9]+ warning|warning:|^ *$|^ *\||^ *= |^ +--> |^ +(Compiling|Checking|Downloaded|Downloading|Updating|Finished|Running) ' > "$plain" || true
            # A failed assert!'s own message is the diagnostic: print what comes
            # after the "panicked at" line first, since that is where the test
            # prints the list of what it found.
            if grep -q "panicked at" "$plain"; then
              echo "--- the failure"
              sed -n '/panicked at/,$p' "$plain" | head -6 | sed 's/^/::error::log: /'
            fi
            echo "--- first lines"
            head -4 "$plain" | sed 's/^/::error::log: /' || true
            echo "--- last lines"
            tail -4 "$plain" | sed 's/^/::error::log: /' || true
            rm -f "$plain"
            true
          done

  # rustudio.app for Apple Silicon and Intel in one (ad-hoc signed, not
  # notarized), as a build artifact; attached to the release for a v* tag.
  macos-app:
    needs: lockfile
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      # The lock job may have committed a refresh to this branch, and
      # `github.sha` is the commit that started the run — one behind it. Check
      # out the ref, so --locked is applied to the tree the lock describes.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: bash tools/macos/bundle.sh --universal
      - name: Check the bundle
        run: |
          lipo -archs target/macos/rustudio.app/Contents/MacOS/rustudio | grep -q 'x86_64 arm64'
          codesign --verify --strict target/macos/rustudio.app
          test -f target/macos/rustudio.app/Contents/Resources/api-dump.json
      - uses: actions/upload-artifact@v4
        with:
          name: rustudio-macos-universal
          path: target/macos/*.zip

  # Linux x86_64 (built on 22.04 so it runs on older glibc) and Windows x64:
  # the binary, api-dump.json beside it, and the licences.
  linux-release:
    needs: lockfile
    runs-on: ubuntu-22.04
    steps:
      # The lock job may have committed a refresh to this branch, and
      # `github.sha` is the commit that started the run — one behind it. Check
      # out the ref, so --locked is applied to the tree the lock describes.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - run: cargo build --workspace --release --locked
      - name: Package
        run: |
          # (through bash: a checkout whose files lost their execute bit —
          # a copy made on Windows, a patch applied without modes — packages too)
          bash tools/linux/package.sh target/release/rustudio dist/rustudio-linux-x86_64.tar.gz
      - name: Verify Linux installation
        run: python3 tools/linux/test-package.py dist/rustudio-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rustudio-linux-x86_64
          path: dist/*.tar.gz

  windows-release:
    needs: lockfile
    runs-on: windows-latest
    steps:
      # The lock job may have committed a refresh to this branch, and
      # `github.sha` is the commit that started the run — one behind it. Check
      # out the ref, so --locked is applied to the tree the lock describes.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --locked
      - name: Package
        shell: pwsh
        run: |
          $d = "dist/rustudio-windows-x64"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/rustudio.exe, api-dump.json, LICENSE-MIT, LICENSE-APACHE, README.md $d
          Copy-Item tools/windows/install.ps1, tools/windows/install.cmd, tools/windows/uninstall.cmd $d
          Compress-Archive -Path $d -DestinationPath dist/rustudio-windows-x64.zip
      - name: Verify Windows installation
        shell: pwsh
        run: tools/windows/test-package.ps1 -Archive dist/rustudio-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rustudio-windows-x64
          path: dist/*.zip

  # A v* tag: attaches the three downloads and their SHA-256 sums to the
  # release the maintainer drafted for this tag, then publishes it. This job
  # never creates a release: one made here would be credited to
  # github-actions instead of its author.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lockfile, macos-app, linux-release, windows-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::No release exists for $GITHUB_REF_NAME. The maintainer drafts it first (gh release create $GITHUB_REF_NAME --draft --title \"rustudio $GITHUB_REF_NAME\" --notes-file NOTES.md), then this job is re-run."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          # A pre-release (vX.Y.Z-alpha.N, drafted with --prerelease by
          # rustudio-release) stays one and never becomes "latest", which
          # the in-app updater reads; a stable release becomes latest.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease -q .isPrerelease)" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi

  # Cargo.lock is generated, not hand-written. Adding a dependency or a workspace
  # member makes it stale, and every --locked job then refuses to build before it
  # starts — the failure that broke all six jobs when M1 added a member, and that
  # M2 hit again. The one place that can resolve the graph is CI: `cargo fetch`
  # is a minimal refresh (existing pins stay, only what is missing is added) and
  # the result is committed back to the branch it ran on.
  #
  # This lives in ci.yml rather than its own file because GitHub registers a
  # workflow only once it is on the default branch, and this branch is not.
  #
  # A GITHUB_TOKEN commit does not start workflows, so the refresh's own commit
  # builds nothing by itself: the next push, or a re-run, picks it up.
  lockfile:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # a token-written commit needs the credentials kept for the push below
          persist-credentials: true

      - name: Resolve what is missing (leaves existing pins alone)
        run: cargo fetch --color never

      - name: Say what changed
        if: always()
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "::notice title=Cargo.lock::already resolved; nothing to add"
          else
            echo "::notice title=Cargo.lock::$(git diff --numstat -- Cargo.lock | awk '{print $1" added, "$2" removed"}')"
            git --no-pager diff --stat -- Cargo.lock
          fi

      - name: Commit it back
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "arena-lockfile"
          git config user.email "arena-lockfile@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Cargo.lock: refresh generated by CI (cargo fetch)"
          git push origin "HEAD:${{ github.ref_name }}"

      # A pull request's lock has to come from its branch: this job runs with a
      # read-only token there, and committing to someone's fork is not a thing
      # CI should do. Failing here says so, instead of eleven `--locked` jobs
      # each failing for a reason that is not in their own step.
      - name: A pull request's lock comes from its branch
        if: always() && github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "::notice title=Cargo.lock::current (nothing to resolve)"
          else
            echo "::error title=Cargo.lock::stale; push the refresh to the branch\n\
          This pull request's Cargo.lock does not match its manifests. The lockfile\
          job resolves one on a push to a branch (cargo fetch, committed back), so\
          the fix is a push, not a re-run."
            exit 1
          fi
